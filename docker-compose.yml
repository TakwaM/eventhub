version: "3.9"

services:

  # -------------------------
  # DATABASES & BROKERS
  # -------------------------

  postgres:
    image: postgres:15
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: eventhub_user
      POSTGRES_PASSWORD: eventhub123
      POSTGRES_DB: eventhub-users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub_user -d eventhub-users"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eventhub-net

  mongodb:
    image: mongo:6
    container_name: eventhub-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eventhub-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventhub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - eventhub-net

  # -------------------------
  # DISCOVERY SERVER
  # -------------------------

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - eventhub-net

  # -------------------------
  # CONFIG SERVER
  # -------------------------

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      SPRING_PROFILES_ACTIVE: "native"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:./config-repo"
    volumes:
      - ./config-repo:/app/config-repo
    networks:
      - eventhub-net
    depends_on:
      - postgres
      - mongodb

  # -------------------------
  # KEYCLOAK
  # -------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak
    command:
     - start-dev
    # - --hostname=localhost
    # - --hostname-port=8180
    # - --proxy=edge
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_FRONTEND_URL: http://localhost:8180/ 
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - eventhub-net

  # -------------------------
  # API GATEWAY
  # -------------------------

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8088:8088"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - eventhub-net

  # -------------------------
  # MICROSERVICES
  # -------------------------

  users-service:
    build: ./users-service
    container_name: users-service
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - discovery-server
      - config-server
    restart: unless-stopped
    networks:
      - eventhub-net

  events-service:
    build: ./events-service
    container_name: events-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - discovery-server
      - config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      WAIT_TIMEOUT: "120"
    restart: unless-stopped
    networks:
      - eventhub-net

  reservations-service:
    build: ./reservations-service
    container_name: reservations-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_APPLICATION_JSON: '{"logging":{"level":{"org.springframework.cloud.config.client":"DEBUG","org.springframework.cloud":"DEBUG","org.springframework.boot.context.config":"DEBUG"}}}'
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      WAIT_TIMEOUT: "120"
    restart: unless-stopped
    networks:
      - eventhub-net

  notifications-service:
    build: ./notifications-service
    container_name: notifications-service
    ports:
      - "8085:8085"
    depends_on:
      - rabbitmq
      - mongodb
      - discovery-server
      - config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      WAIT_TIMEOUT: "120"
    restart: unless-stopped
    networks:
      - eventhub-net

# -------------------------
# NETWORKS & VOLUMES
# -------------------------

networks:
  eventhub-net:

volumes:
  postgres_data:
  mongo_data:
  keycloak_data: