spring.application.name=events-service
server.port=8081

# -------------------------
# DATABASE POSTGRES
# -------------------------
spring.datasource.url=jdbc:postgresql://postgres:5432/eventhub_events
spring.datasource.username=eventhub_user
spring.datasource.password=eventhub123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# -------------------------
# EUREKA
# -------------------------
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# -------------------------
# SECURITY (JWT)
# -------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/eventhub
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=realm_access.roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_