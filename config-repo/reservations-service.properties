spring.application.name=reservations-service
server.port=8082

# -------------------------
# DATABASE POSTGRES
# -------------------------
spring.datasource.url=jdbc:postgresql://postgres:5432/eventhub_reservations
spring.datasource.username=eventhub_user
spring.datasource.password=eventhub123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# -------------------------
# EUREKA
# -------------------------
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# -------------------------
# RABBITMQ
# -------------------------
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# -------------------------
# SECURITY (JWT)
# -------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/eventhub
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=realm_access.roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_