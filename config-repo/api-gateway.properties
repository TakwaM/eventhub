spring.application.name=api-gateway
server.port=8088

# Eureka
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Autoriser override
spring.cloud.config.allowOverride=true
spring.cloud.config.overrideNone=false
spring.cloud.config.overrideSystemProperties=false

#Keyloack
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/eventhub
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/eventhub/protocol/openid-connect/certs
#spring.security.oauth2.resourceserver.jwt.authorities-claim-name=realm_access.roles
#spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
#spring.security.oauth2.resourceserver.jwt.authorities-claim-prefix=ROLE_


# debug Spring Security
logging.level.org.springframework.security=DEBUG
# debug OAuth2 / resource server
logging.level.org.springframework.security.oauth2=DEBUG
# (optionnel, plus précis)
logging.level.org.springframework.security.oauth2.server.resource=DEBUG
