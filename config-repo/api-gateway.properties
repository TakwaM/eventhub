spring.application.name=api-gateway
server.port=8088

# Eureka
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Autoriser override
spring.cloud.config.allowOverride=true
spring.cloud.config.overrideNone=false
spring.cloud.config.overrideSystemProperties=false

# -------------------------
# SECURITY (JWT)
# -------------------------
# issuer must match token iss (what Keycloak emits)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/eventhub

# container must be able to reach the JWKS endpoint on the host
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://host.docker.internal:8180/realms/eventhub/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.authorities-claim-name=realm_access.roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=

# Logging détaillé pour diagnostiquer 401
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty.http.server=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# Optionnel : activer debug complet de Spring Security (verbeux)
spring.security.debug=true

#analytics-sevice
spring.cloud.gateway.routes[0].id=analytics-service
spring.cloud.gateway.routes[0].uri=http://analytics-service:4000
spring.cloud.gateway.routes[0].predicates[0]=Path=/analytics/**

# CORS global pour Spring Cloud Gateway (autorise uniquement localhost:4200)
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# Route frontend Angular
spring.cloud.gateway.routes[1].id=frontend
spring.cloud.gateway.routes[1].uri=forward:/index.html
spring.cloud.gateway.routes[1].predicates[0]=Path=/**